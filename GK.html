<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 2 GK Trivia Explorer!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                    },
                    colors: {
                        primary: '#4F46E5', // Indigo 600
                        secondary: '#10B981', // Emerald 500
                        accent: '#F59E0B', // Amber 500
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #a78bfa 0%, #60a5fa 100%);
            min-height: 100vh;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        .fade-out {
            animation: fadeOut 0.3s ease-in forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes fadeOut {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(-10px) scale(0.98); }
        }

        .option-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .option-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        
        .option-btn:active {
            transform: translateY(1px) scale(0.98);
        }

        /* Progress bar animation */
        .progress-fill {
            transition: width 0.4s ease-out;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 antialiased text-gray-800">

    <!-- Screen 1: Welcome / Name Entry -->
    <div id="welcome-screen" class="glass-card w-full max-w-md rounded-3xl p-8 text-center fade-in">
        <div class="mb-6 inline-flex items-center justify-center w-20 h-20 bg-indigo-100 text-5xl rounded-full shadow-inner">
            🎓
        </div>
        <h1 class="text-3xl font-extrabold text-indigo-700 mb-2">Kids GK Trivia!</h1>
        <p class="text-gray-500 mb-8 font-semibold">Class 2 Edition</p>
        
        <div class="space-y-4">
            <div>
                <label for="playerName" class="block text-left text-sm font-bold text-gray-700 mb-1 ml-1">What is your name?</label>
                <input type="text" id="playerName" placeholder="Enter your name here..." 
                    class="w-full px-5 py-4 border-2 border-indigo-200 rounded-2xl focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 transition-all text-lg font-semibold"
                    autocomplete="off">
                <p id="name-error" class="text-red-500 text-sm font-semibold mt-2 hidden text-left ml-1">Please enter your name to start!</p>
            </div>
            <button onclick="startQuiz()" 
                class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold py-4 px-6 rounded-2xl shadow-lg transform transition hover:scale-105 active:scale-95 text-xl">
                Let's Play! 🚀
            </button>
        </div>
    </div>

    <!-- Screen 2: Quiz Area -->
    <div id="quiz-screen" class="glass-card w-full max-w-2xl rounded-3xl p-6 md:p-10 hidden">
        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-purple-100 rounded-full flex items-center justify-center text-xl shadow-inner font-bold text-purple-700">
                    <span id="player-avatar">👤</span>
                </div>
                <div>
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Player</p>
                    <p id="display-name" class="font-extrabold text-lg text-gray-700 truncate max-w-[120px]">Name</p>
                </div>
            </div>
            <div class="text-right">
                <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Question <span id="question-number">1</span> of 9</p>
                <span id="difficulty-badge" class="inline-block mt-1 px-3 py-1 text-xs font-extrabold rounded-full bg-green-100 text-green-700">
                    EASY
                </span>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="w-full bg-gray-200 rounded-full h-3 mb-8 shadow-inner">
            <div id="progress-bar" class="bg-gradient-to-r from-indigo-400 to-purple-500 h-3 rounded-full progress-fill" style="width: 0%"></div>
        </div>

        <!-- Question Area -->
        <div id="question-container" class="mb-8 min-h-[100px] flex items-center justify-center">
            <h2 id="question-text" class="text-2xl md:text-3xl font-extrabold text-center text-gray-800 leading-tight">
                Question goes here?
            </h2>
        </div>

        <!-- Options Area -->
        <div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Options will be injected here by JS -->
        </div>
    </div>

    <!-- Screen 3: Result Area -->
    <div id="result-screen" class="glass-card w-full max-w-lg rounded-3xl p-8 text-center hidden">
        <div class="mb-6 relative inline-block">
            <div class="w-32 h-32 bg-yellow-100 rounded-full flex items-center justify-center text-6xl shadow-inner mx-auto z-10 relative">
                🏆
            </div>
            <!-- Decorative confetti elements (CSS-based) -->
            <div class="absolute top-0 -left-4 text-3xl animate-bounce" style="animation-delay: 0.1s">✨</div>
            <div class="absolute bottom-4 -right-4 text-3xl animate-bounce" style="animation-delay: 0.3s">🌟</div>
            <div class="absolute top-1/2 -right-8 text-2xl animate-bounce" style="animation-delay: 0.2s">🎉</div>
        </div>
        
        <h2 id="result-title" class="text-3xl font-extrabold text-gray-800 mb-2">Great Job, Name!</h2>
        <p id="result-message" class="text-gray-500 font-semibold mb-6">You completed the trivia.</p>
        
        <div class="bg-gray-50 rounded-2xl p-6 mb-8 border-2 border-gray-100 shadow-inner">
            <p class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-1">Your Score</p>
            <div class="flex items-end justify-center gap-1">
                <span id="final-score" class="text-6xl font-extrabold text-indigo-600">0</span>
                <span class="text-3xl font-bold text-gray-400 mb-1">/9</span>
            </div>
        </div>

        <button onclick="restartQuiz()" 
            class="w-full bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-500 hover:to-teal-600 text-white font-bold py-4 px-6 rounded-2xl shadow-lg transform transition hover:scale-105 active:scale-95 text-xl">
            Play Again 🔄
        </button>
    </div>

    <script>
        // Quiz Data - Carefully curated for Class 2 students (7-8 years old)
        // Progression: 3 Easy -> 3 Medium -> 3 Hard
        const questions = [
            // EASY
            {
                difficulty: "Easy",
                color: "bg-green-100 text-green-700",
                question: "How many days are there in a single week?",
                options: ["5 Days", "6 Days", "7 Days", "8 Days"],
                answer: "7 Days"
            },
            {
                difficulty: "Easy",
                color: "bg-green-100 text-green-700",
                question: "Which animal is known as the 'King of the Jungle'?",
                options: ["Tiger", "Elephant", "Bear", "Lion"],
                answer: "Lion"
            },
            {
                difficulty: "Easy",
                color: "bg-green-100 text-green-700",
                question: "What do you call a baby dog?",
                options: ["Kitten", "Puppy", "Cub", "Calf"],
                answer: "Puppy"
            },
            // MEDIUM
            {
                difficulty: "Medium",
                color: "bg-yellow-100 text-yellow-700",
                question: "How many letters are there in the English alphabet?",
                options: ["24", "25", "26", "27"],
                answer: "26"
            },
            {
                difficulty: "Medium",
                color: "bg-yellow-100 text-yellow-700",
                question: "Which organ in our body helps us taste food?",
                options: ["Nose", "Eyes", "Tongue", "Ears"],
                answer: "Tongue"
            },
            {
                difficulty: "Medium",
                color: "bg-yellow-100 text-yellow-700",
                question: "Which is the largest land animal in the world?",
                options: ["Giraffe", "Elephant", "Rhinoceros", "Hippopotamus"],
                answer: "Elephant"
            },
            // HARD
            {
                difficulty: "Hard",
                color: "bg-red-100 text-red-700",
                question: "What is a baby frog called?",
                options: ["Tadpole", "Fry", "Nymph", "Caterpillar"],
                answer: "Tadpole"
            },
            {
                difficulty: "Hard",
                color: "bg-red-100 text-red-700",
                question: "Which part of a plant grows under the ground?",
                options: ["Leaves", "Stem", "Flowers", "Roots"],
                answer: "Roots"
            },
            {
                difficulty: "Hard",
                color: "bg-red-100 text-red-700",
                question: "Which of these birds cannot fly?",
                options: ["Sparrow", "Eagle", "Penguin", "Parrot"],
                answer: "Penguin"
            }
        ];

        // State Variables
        let currentQuestionIndex = 0;
        let score = 0;
        let playerName = "";

        // DOM Elements
        const welcomeScreen = document.getElementById('welcome-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const nameInput = document.getElementById('playerName');
        const nameError = document.getElementById('name-error');
        
        // Handle Start Game
        function startQuiz() {
            const name = nameInput.value.trim();
            if (name === "") {
                nameError.classList.remove('hidden');
                nameInput.classList.add('border-red-400', 'ring-red-100');
                return;
            }
            
            // Setup game state
            playerName = name;
            currentQuestionIndex = 0;
            score = 0;
            
            // Set UI variables
            document.getElementById('display-name').textContent = playerName;
            document.getElementById('player-avatar').textContent = playerName.charAt(0).toUpperCase();

            // Transition Screens
            switchScreen(welcomeScreen, quizScreen);
            loadQuestion();
        }

        // Allow pressing Enter to start
        nameInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                startQuiz();
            }
            // Clear error styling on type
            nameError.classList.add('hidden');
            nameInput.classList.remove('border-red-400', 'ring-red-100');
        });

        // Load Question Data into UI
        function loadQuestion() {
            const q = questions[currentQuestionIndex];
            
            // Update Header info
            document.getElementById('question-number').textContent = currentQuestionIndex + 1;
            
            const diffBadge = document.getElementById('difficulty-badge');
            diffBadge.textContent = q.difficulty.toUpperCase();
            diffBadge.className = `inline-block mt-1 px-3 py-1 text-xs font-extrabold rounded-full ${q.color}`;
            
            // Update Progress bar
            const progress = ((currentQuestionIndex) / questions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;

            // Setup Question text with small fade animation
            const qText = document.getElementById('question-text');
            qText.classList.remove('fade-in');
            void qText.offsetWidth; // trigger reflow to restart animation
            qText.textContent = q.question;
            qText.classList.add('fade-in');

            // Setup Options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = ''; // Clear previous
            
            // Create buttons for each option
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                // Option Styling
                btn.className = "option-btn w-full bg-white border-2 border-indigo-100 hover:border-indigo-400 hover:bg-indigo-50 text-gray-700 font-bold py-4 px-6 rounded-2xl text-lg md:text-xl text-left shadow-sm flex items-center";
                
                // Option Letter Circle (A, B, C, D)
                const letters = ['A', 'B', 'C', 'D'];
                btn.innerHTML = `
                    <span class="flex-shrink-0 w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center text-sm mr-4 border border-indigo-200">
                        ${letters[index]}
                    </span>
                    <span>${opt}</span>
                `;
                
                // On Click listener
                btn.onclick = () => handleAnswer(opt);
                
                // Add staggered animation
                btn.classList.add('fade-in');
                btn.style.animationDelay = `${index * 0.1}s`;
                
                optionsContainer.appendChild(btn);
            });
        }

        // Handle Answer Selection
        function handleAnswer(selectedOption) {
            const correctAnswer = questions[currentQuestionIndex].answer;
            
            if (selectedOption === correctAnswer) {
                score++;
            }

            // Immediately advance to next
            currentQuestionIndex++;
            
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        // Show Final Results Screen
        function showResults() {
            // Final Progress update
            document.getElementById('progress-bar').style.width = `100%`;
            
            // Wait a tiny fraction so progress bar finishes filling visually
            setTimeout(() => {
                // Populate Result Screen
                const title = document.getElementById('result-title');
                const message = document.getElementById('result-message');
                document.getElementById('final-score').textContent = score;

                // Personalized messages based on score
                if (score === 9) {
                    title.textContent = `Perfect, ${playerName}! 🌟`;
                    message.textContent = "You are a GK Genius! Amazing job!";
                } else if (score >= 6) {
                    title.textContent = `Great Job, ${playerName}! 👏`;
                    message.textContent = "You know a lot of things. Keep it up!";
                } else if (score >= 3) {
                    title.textContent = `Good Try, ${playerName}! 👍`;
                    message.textContent = "Keep learning and practicing. You'll get even better!";
                } else {
                    title.textContent = `Nice Try, ${playerName}! 💪`;
                    message.textContent = "Learning is fun! Try again to get a higher score.";
                }

                switchScreen(quizScreen, resultScreen);
            }, 300); // 300ms delay for aesthetics
        }

        // Restart Quiz functionality
        function restartQuiz() {
            // Reset state
            currentQuestionIndex = 0;
            score = 0;
            // Go back to Question 1
            switchScreen(resultScreen, quizScreen);
            loadQuestion();
        }

        // Utility function for smooth screen transitions
        function switchScreen(fromScreen, toScreen) {
            fromScreen.classList.remove('fade-in');
            fromScreen.classList.add('fade-out');
            
            // Wait for fade-out animation to finish
            setTimeout(() => {
                fromScreen.classList.add('hidden');
                fromScreen.classList.remove('fade-out');
                
                toScreen.classList.remove('hidden');
                toScreen.classList.add('fade-in');
            }, 250);
        }
    </script>
</body>
</html>
