<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ResellReads</title>
  <style>
    :root{
      --bg:#f7f7fb;
      --card:#ffffff;
      --muted:#6b7280;
      --accent:#2563eb;
      --highlight:#fff59d;
    }
    body{
      margin:0;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background:var(--bg);
      color:#111827;
    }
    header{
      background:linear-gradient(90deg,#0ea5e9 0%, #6366f1 100%);
      color:white;
      padding:20px 16px;
      display:flex;
      align-items:center;
      gap:16px;
      flex-wrap:wrap;
    }
    .brand h1{margin:0;font-size:20px;}
    .container{max-width:1100px;margin:24px auto;padding:0 16px;}
    .search-wrap{display:flex;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap;}
    .search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:10px;padding:8px 12px;box-shadow:0 1px 2px rgba(0,0,0,0.04);min-width:260px;flex:1 1 360px;}
    .search input{border:0;outline:0;font-size:15px;width:100%;background:transparent;color:inherit;}
    .search .count{font-size:13px;color:var(--muted);white-space:nowrap;}
    .filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
    .btn{background:transparent;border:1px solid rgba(0,0,0,0.06);padding:8px 12px;border-radius:8px;cursor:pointer;font-size:14px;}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}
    .card{background:var(--card);border-radius:10px;padding:12px;box-shadow:0 6px 18px rgba(15,23,42,0.06);display:flex;gap:12px;align-items:flex-start;}
    .thumb{width:56px;height:80px;background:linear-gradient(180deg,#e6eefc,#f8fafc);border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;}
    .meta{flex:1;}
    .title{font-weight:600;margin:0 0 6px 0;font-size:15px;}
    .author{margin:0;color:var(--muted);font-size:13px;}
    .price{margin-top:8px;font-weight:700;color:var(--accent);font-size:14px;}
    mark.match{background:var(--highlight);padding:0 2px;border-radius:2px;color:#111827;}
    .empty{text-align:center;color:var(--muted);padding:36px 12px;background:transparent;border-radius:8px;}
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect width="24" height="24" rx="6" fill="white" opacity="0.06"></rect>
        <path d="M6 7h12v2H6zM6 11h12v6H6z" fill="white" opacity="0.9"></path>
      </svg>
      <h1>ResellReads</h1>
    </div>
    <div style="margin-left:auto; color:rgba(255,255,255,0.9); font-size:14px;">Buy Sell Swap Books</div>
  </header>

  <main class="container">
    <div class="search-wrap" aria-label="Search area">
      <div class="search" role="search" aria-label="Search books">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M21 21l-4.35-4.35" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="11" cy="11" r="6" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <input id="searchInput" type="search" placeholder="Search by title, author, or ISBN" aria-label="Search books by title author or ISBN" />
        <div class="count" id="resultCount">Showing <strong id="visibleCount">0</strong> of <span id="totalCount">0</span></div>
      </div>

      <div class="filters" aria-hidden="false">
        <button class="btn" id="clearBtn" title="Clear search">Clear</button>
        <button class="btn" id="showAllBtn" title="Show all items">Show All</button>
      </div>
    </div>

    <section id="itemsSection" class="grid" aria-live="polite"></section>
    <div id="emptyState" class="empty" style="display:none;">No results found. Try a different search term.</div>
  </main>

  <script>
    // Replace this sample data with your real data source
    const items = [
      { id:1, title:"Atomic Habits", author:"James Clear", isbn:"9780735211292", price:"₹350" },
      { id:2, title:"The Alchemist", author:"Paulo Coelho", isbn:"9780061122415", price:"₹220" },
      { id:3, title:"Clean Code", author:"Robert C. Martin", isbn:"9780132350884", price:"₹480" },
      { id:4, title:"The Pragmatic Programmer", author:"Andrew Hunt", isbn:"9780201616224", price:"₹520" },
      { id:5, title:"To Kill a Mockingbird", author:"Harper Lee", isbn:"9780060935467", price:"₹300" },
      { id:6, title:"The Women", author:"Anita Nair", isbn:"9780143421234", price:"₹260" },
      { id:7, title:"Women Who Run With the Wolves", author:"Clarissa Pinkola Estés", isbn:"9780345409876", price:"₹420" }
    ];

    const itemsSection = document.getElementById('itemsSection');
    const searchInput = document.getElementById('searchInput');
    const visibleCount = document.getElementById('visibleCount');
    const totalCount = document.getElementById('totalCount');
    const emptyState = document.getElementById('emptyState');
    const clearBtn = document.getElementById('clearBtn');
    const showAllBtn = document.getElementById('showAllBtn');

    totalCount.textContent = items.length;

    // Common stopwords to ignore in queries
    const STOPWORDS = new Set(['the','a','an','of','and','in','on','for','with','by','to','from']);

    // Normalize string: lowercase, remove diacritics, collapse whitespace
    function normalizeText(str) {
      return String(str || '')
        .normalize('NFD')                      // separate diacritics
        .replace(/\p{Diacritic}/gu, '')        // remove diacritics
        .toLowerCase()
        .replace(/\s+/g, ' ')
        .trim();
    }

    // Escape regex special chars
    function escapeRegExp(s) {
      return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    // Tokenize query into meaningful tokens (remove stopwords)
    function tokenizeQuery(q) {
      if (!q) return [];
      const normalized = normalizeText(q);
      const tokens = normalized.split(/\s+/).filter(Boolean);
      return tokens.filter(t => !STOPWORDS.has(t));
    }

    // Render list with optional highlighting for tokens
    function renderList(list, tokens) {
      itemsSection.innerHTML = '';
      if (!list.length) {
        emptyState.style.display = 'block';
      } else {
        emptyState.style.display = 'none';
      }

      // Build regex for highlighting: join tokens with | and escape
      const highlightRegex = tokens.length ? new RegExp(tokens.map(escapeRegExp).join('|'), 'ig') : null;

      list.forEach(item => {
        const card = document.createElement('article');
        card.className = 'card';
        card.setAttribute('data-id', item.id);

        const thumb = document.createElement('div');
        thumb.className = 'thumb';
        thumb.textContent = item.title.split(' ').slice(0,2).map(s=>s[0]).join('').toUpperCase();

        const meta = document.createElement('div');
        meta.className = 'meta';

        const title = document.createElement('h3');
        title.className = 'title';
        if (highlightRegex) {
          title.innerHTML = item.title.replace(highlightRegex, match => `<mark class="match">${match}</mark>`);
        } else {
          title.textContent = item.title;
        }

        const author = document.createElement('p');
        author.className = 'author';
        if (highlightRegex) {
          author.innerHTML = item.author.replace(highlightRegex, match => `<mark class="match">${match}</mark>`);
        } else {
          author.textContent = item.author;
        }

        const isbn = document.createElement('div');
        isbn.style.fontSize = '12px';
        isbn.style.color = 'var(--muted)';
        if (highlightRegex) {
          isbn.innerHTML = item.isbn.replace(highlightRegex, match => `<mark class="match">${match}</mark>`);
        } else {
          isbn.textContent = item.isbn;
        }

        const price = document.createElement('div');
        price.className = 'price';
        price.textContent = item.price;

        meta.appendChild(title);
        meta.appendChild(author);
        meta.appendChild(isbn);
        meta.appendChild(price);

        card.appendChild(thumb);
        card.appendChild(meta);

        itemsSection.appendChild(card);
      });

      visibleCount.textContent = list.length;
    }

    // Search: token-based, matches if ANY token appears in title/author/isbn
    function performSearch(rawQuery) {
      const tokens = tokenizeQuery(rawQuery);
      // If query had only stopwords (e.g., "the a an"), treat as empty -> show all
      if (!tokens.length && rawQuery.trim() === '') {
        renderList(items, []);
        return;
      }
      if (!tokens.length && rawQuery.trim() !== '') {
        // tokens removed because they were stopwords; fallback to using raw words (so "the women" -> "women")
        const fallbackTokens = rawQuery.trim().split(/\s+/).map(t => normalizeText(t)).filter(Boolean);
        return performSearch(fallbackTokens.join(' '));
      }

      const filtered = items.filter(it => {
        // prepare searchable string for each field
        const title = normalizeText(it.title);
        const author = normalizeText(it.author);
        const isbn = normalizeText(it.isbn);

        // token must match somewhere (partial match allowed)
        return tokens.every(token => {
          return title.includes(token) || author.includes(token) || isbn.includes(token);
        });
      });

      renderList(filtered, tokens);
    }

    // Debounce helper
    function debounce(fn, wait) {
      let t;
      return function(...args) {
        clearTimeout(t);
        t = setTimeout(() => fn.apply(this, args), wait);
      };
    }

    const debouncedSearch = debounce((e) => performSearch(e.target.value), 160);

    // Initial render
    renderList(items, []);

    // Event listeners
    searchInput.addEventListener('input', debouncedSearch);

    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      performSearch('');
      searchInput.focus();
    });

    showAllBtn.addEventListener('click', () => {
      searchInput.value = '';
      performSearch('');
    });

    // Enter focuses first result
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const first = itemsSection.querySelector('.card');
        if (first) first.scrollIntoView({behavior:'smooth', block:'center'});
      }
    });

    // If you fetch items from server, call:
    // totalCount.textContent = items.length;
    // renderList(items, []);
  </script>
</body>
</html>
