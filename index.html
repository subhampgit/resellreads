<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Resell Reads</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    h1 {
      background: #4a90e2;
      color: white;
      padding: 20px;
      margin: 0;
    }

    #searchBox {
      margin: 20px;
      padding: 10px;
      width: 300px;
      border: 2px solid #4a90e2;
      border-radius: 5px;
      outline: none;
      transition: 0.3s;
    }

    #searchBox:focus {
      border-color: #2c6fb2;
      box-shadow: 0 0 5px rgba(74, 144, 226, 0.5);
    }

    button {
      padding: 10px 15px;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #2c6fb2;
    }

    #results {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin: 20px;
    }

    .book {
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      margin: 15px;
      padding: 15px;
      width: 200px;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .book:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    }

    .book h3 {
      font-size: 18px;
      color: #333;
      margin-bottom: 10px;
    }

    .book img {
      width: 100%;
      height: auto;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h1>Resell Reads</h1>

  <!-- Search bar -->
  <input type="text" id="searchBox" placeholder="Search for a book...">
  <button onclick="searchBook()">Search</button>

  <!-- Results -->
  <div id="results"></div>

  <script>
    // Book data
    const books = [
      { title: "Women", image: "images/women.jpg" },
      { title: "Men", image: "images/men.jpg" },
      { title: "Children", image: "images/children.jpg" }
    ];

    function searchBook() {
      const query = document.getElementById("searchBox").value.toLowerCase();
      const resultDiv = document.getElementById("results");
      resultDiv.innerHTML = "";

      let found = false;
      books.forEach(book => {
        if (book.title.toLowerCase().includes(query)) {
          resultDiv.innerHTML += `
            <div class="book">
              <h3>${book.title}</h3>
              <img src="${book.image}" alt="${book.title}">
            </div>`;
          found = true;
        }
      });

      // If not found, fallback
      if (!found) {
        resultDiv.innerHTML = `
          <div class="book">
            <h3>Default Book</h3>
            <img src="images/default.jpg" alt="Default Book">
          </div>`;
      }
    }
  </script>
</body>
</html>
